<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Form Validation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #74ebd5, #ACB6E5);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        transition: 0.3s;
    }

    input:focus {
        border-color: #007BFF;
        outline: none;
        box-shadow: 0 0 5px rgba(0,123,255,0.5);
    }

    .error {
        color: red;
        font-size: 12px;
        display: none;
    }

    .success {
        border-color: green;
    }

    .error-input {
        border-color: red;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #007BFF;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #0056b3;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Register Form</h2>

    <form id="myForm">

        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name">
            <div class="error" id="nameError">Name must be at least 3 characters</div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text" id="email">
            <div class="error" id="emailError">Enter a valid email</div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
            <div class="error" id="passError">Minimum 6 characters</div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword">
            <div class="error" id="confirmError">Passwords do not match</div>
        </div>

        <button type="submit">Submit</button>

    </form>
</div>

<script>
const form = document.getElementById("myForm");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    let isValid = true;

    let name = document.getElementById("name");
    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let confirmPassword = document.getElementById("confirmPassword");

    // Name Validation
    if (name.value.length < 3) {
        showError(name, "nameError");
        isValid = false;
    } else {
        showSuccess(name, "nameError");
    }

    // Email Validation
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.value.match(emailPattern)) {
        showError(email, "emailError");
        isValid = false;
    } else {
        showSuccess(email, "emailError");
    }

    // Password Validation
    if (password.value.length < 6) {
        showError(password, "passError");
        isValid = false;
    } else {
        showSuccess(password, "passError");
    }

    // Confirm Password
    if (confirmPassword.value !== password.value || confirmPassword.value === "") {
        showError(confirmPassword, "confirmError");
        isValid = false;
    } else {
        showSuccess(confirmPassword, "confirmError");
    }

    if (isValid) {
        alert("Form submitted successfully!");
    }
});

function showError(input, errorId) {
    input.classList.add("error-input");
    input.classList.remove("success");
    document.getElementById(errorId).style.display = "block";
}

function showSuccess(input, errorId) {
    input.classList.remove("error-input");
    input.classList.add("success");
    document.getElementById(errorId).style.display = "none";
}
</script>

</body>
</html>
